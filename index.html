<!DOCTYPE html>
<html>
<head>
    <title>Sticker Race</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 30px; }
        .emoji { font-size: 100px; margin: 30px; animation: bounce 1s infinite; }
        @keyframes bounce { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-20px); } 
        }
        .stickers { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .sticker {
            width: 100px;
            height: 100px;
            cursor: pointer;
            border: 4px solid white;
            border-radius: 15px;
            transition: all 0.3s;
        }
        .sticker:hover { 
            transform: scale(1.1); 
            border-color: gold; 
        }
        .message { 
            font-size: 24px; 
            margin: 20px; 
            padding: 15px; 
            border-radius: 10px; 
        }
        button {
            background: gold;
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🎮 Кто быстрее подберет стикер?</h1>
    <div class="emoji" id="emoji">😊</div>
    <div class="stickers" id="stickers"></div>
    <div class="message" id="message"></div>
    <button onclick="newRound()">🎲 Следующий раунд</button>

    <script>
        // Принудительная инициализация Telegram
        window.TelegramWebviewProxy = { postEvent: function() {} };
        window.Telegram = { WebView: { initParams: {} } };
        
        let tg = Telegram.WebApp;
        tg.expand();
        
        // Простая база данных эмодзи и стикеров
        const gameData = {
            '😊': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60a.png',
            '😂': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f602.png',
            '😍': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60d.png',
            '😎': 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60e.png'
        };
        
        const emojis = Object.keys(gameData);
        let currentCorrectSticker = gameData['😊'];
        
        function newRound() {
            // Выбираем случайный эмодзи
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('emoji').textContent = randomEmoji;
            currentCorrectSticker = gameData[randomEmoji];
            
            // Показываем стикеры
            showStickers();
            document.getElementById('message').innerHTML = '';
        }
        
        function showStickers() {
            const stickersDiv = document.getElementById('stickers');
            stickersDiv.innerHTML = '';
            
            // Получаем все стикеры
            const allStickers = Object.values(gameData);
            
            // Перемешиваем
            const shuffled = [...allStickers].sort(() => Math.random() - 0.5);
            
            // Показываем первые 3
            shuffled.slice(0, 3).forEach(sticker => {
                const img = document.createElement('img');
                img.src = sticker;
                img.className = 'sticker';
                img.onclick = () => checkSticker(sticker);
                stickersDiv.appendChild(img);
            });
        }
        
        function checkSticker(selectedSticker) {
            if (selectedSticker === currentCorrectSticker) {
                document.getElementById('message').innerHTML = '✅ ПРАВИЛЬНО!';
                document.getElementById('message').style.color = '#4caf50';
                tg.sendData(JSON.stringify({result: 'win'}));
            } else {
                document.getElementById('message').innerHTML = '❌ НЕПРАВИЛЬНО!';
                document.getElementById('message').style.color = '#f44336';
            }
        }
        
        // Запускаем первый раунд
        newRound();
    </script>
</body>
</html>

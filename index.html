<!DOCTYPE html>
<html>
<head>
    <title>Sticker Race</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #667eea;
            color: white;
            padding: 20px;
        }
        .emoji {
            font-size: 100px;
            margin: 30px;
        }
        .stickers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .sticker {
            width: 100px;
            height: 100px;
            cursor: pointer;
            border: 3px solid white;
            border-radius: 10px;
        }
        .sticker:hover {
            border-color: gold;
        }
        .message {
            font-size: 24px;
            margin: 20px;
            min-height: 40px;
        }
        button {
            background: gold;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Кто быстрее подберет стикер?</h1>
    <div class="emoji" id="emoji">😊</div>
    
    <div class="stickers" id="stickers">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60a.png" class="sticker" onclick="check(true)">
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f602.png" class="sticker" onclick="check(false)">
    </div>
    
    <div class="message" id="message">Выбери стикер!</div>
    
    <button onclick="nextRound()">Следующий раунд</button>

    <script>
        // Инициализация Telegram
        let tg = Telegram.WebApp;
        tg.expand();
        
        // Простые функции
        function check(isCorrect) {
            if (isCorrect) {
                document.getElementById('message').innerHTML = '✅ Правильно!';
                tg.sendData('win');
            } else {
                document.getElementById('message').innerHTML = '❌ Неправильно!';
            }
        }
        
        function nextRound() {
            document.getElementById('message').innerHTML = 'Выбери стикер!';
        }
        
        // Делаем функции доступными глобально
        window.check = check;
        window.nextRound = nextRound;
    </script>
</body>
</html>
